services:
  crime-trends-postgres:
    image: postgres:16
    container_name: crime-trends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cpd_db
      POSTGRES_USER: cpd_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - crime_trends_postgres_data:/var/lib/postgresql/data

volumes:
  crime_trends_postgres_data: